name: Build llama.cpp Windows MSVC

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    name: Windows MSVC build
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'

      - name: Configure CMake (CPU AVX2)
        working-directory: llama.cpp
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON

      - name: Build
        working-directory: llama.cpp
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Path "llama.cpp\build\bin\Release\*.exe" -Destination "artifacts\" -ErrorAction SilentlyContinue
          Copy-Item -Path "llama.cpp\build\bin\Release\*.dll" -Destination "artifacts\" -ErrorAction SilentlyContinue
          Copy-Item -Path "llama.cpp\build\bin\*.exe" -Destination "artifacts\" -ErrorAction SilentlyContinue
          Copy-Item -Path "llama.cpp\build\bin\*.dll" -Destination "artifacts\" -ErrorAction SilentlyContinue
          Get-ChildItem -Path artifacts -Name | Out-String

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-msvc-x64
          path: artifacts/*
          if-no-files-found: error
