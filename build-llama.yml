# GitHub Actions workflow to build llama.cpp on Windows (MSVC)
NAME: Build llama.cpp Windows MSVC

ON:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-ls:latest
    # windows-2022
    name: Windows MSVC build
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1.1
        with:
          vsversion: '17.0'

      - name: Setup CMake
        uses: actions/setup-cmake@v1

      - name: Configure CMake (CPU + AVX2)
        working-directory: llama.cpp
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON

      - name: Build
        working-directory: llama.cpp
        run: cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Collect artifacts
        run: |
          mkdir artifacts
          copy llama.cpp\build\bin\Release\*.exe artifacts\ 2>nul
          copy llama.cpp\build\bin\Release\*.dll artifacts\ 2>nul
          copy llama.cpp\build\Release\*.exe artifacts\ 2>nul
          copy llama.cpp\build\Release\*.dll artifacts\ 2>nul
          if exist llama.cpp\build\bin\*.exe copy llama.cpp\build\bin\*.exe artifacts\ 2>nul
          dir /b artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-msvc-x64
          path: artifacts/*
          if-no-files-found: error
    timeout-minutes: 60
